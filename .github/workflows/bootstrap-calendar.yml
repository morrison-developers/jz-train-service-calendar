name: Bootstrap service-account-owned calendar

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type CREATE to create a new public calendar"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    if: ${{ inputs.confirmation == 'CREATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: client-dashboard-461117
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Create public calendar
        run: jz-calendar-bootstrap
