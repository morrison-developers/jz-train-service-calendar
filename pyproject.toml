[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jz-service-calendar"
version = "1.0.0"
description = "Synchronize planned NYC Subway J/Z service changes to Google Calendar"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "google-api-python-client>=2.160,<3",
  "google-auth>=2.38,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.9,<1"]

[project.scripts]
jz-calendar = "jz_calendar.main:main"

[tool.setuptools.packages.find]
include = ["jz_calendar*"]

[tool.setuptools.package-data]
jz_calendar = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
